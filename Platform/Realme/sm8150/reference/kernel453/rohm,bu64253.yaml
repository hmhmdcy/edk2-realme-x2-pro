# Draft only: not compiled, schema-checked, deployed, or proposed upstream.
%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/rohm,bu64253.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ROHM BU64253 voice coil lens controller

description: |
  Draft for the two retained factory VCM configurations. The firmware-name
  selects a bounded BU53 v1 initialization record file. It contains hardware
  initialization only, without calibrated focus endpoints or a distance map.
  Missing or invalid data must fail probe before any regulator enable or I2C
  write. The file format and DT interface need review before integration.

properties:
  compatible:
    const: rohm,bu64253
  reg:
    maxItems: 1
  vdd-supply: true
  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: BU53 v1 initialization file for the actual attached lens.

required:
  - compatible
  - reg
  - vdd-supply
  - firmware-name

additionalProperties: false
...
