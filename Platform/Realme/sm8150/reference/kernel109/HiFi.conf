SectionVerb {
    # The ASoC front ends resolve their backend at PCM open, before PulseAudio
    # enables an individual UCM device. Keep the known routes available for the
    # HiFi verb; DAPM still gates clocks and amplifiers when streams are idle.
    EnableSequence [
        cset "name='Left Speaker Switch' 1"
        cset "name='Right Speaker Switch' 1"
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
        cset "name='Handset Mic Switch' 1"
        cset "name='DMIC MUX5' DMIC0"
        cset "name='ADC MUX5' DMIC"
        cset "name='CDC_IF TX5 MUX' DEC5"
        cset "name='AIF1_CAP Mixer SLIM TX5' 1"
        cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
    ]
    DisableSequence [
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
        cset "name='Left Speaker Switch' 0"
        cset "name='Right Speaker Switch' 0"
        cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
        cset "name='AIF1_CAP Mixer SLIM TX5' 0"
        cset "name='CDC_IF TX5 MUX' ZERO"
        cset "name='DMIC MUX5' ZERO"
        cset "name='Handset Mic Switch' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Stereo speakers"
    EnableSequence [
        cset "name='Left Speaker Switch' 1"
        cset "name='Right Speaker Switch' 1"
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
    ]
    DisableSequence [
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
        cset "name='Left Speaker Switch' 0"
        cset "name='Right Speaker Switch' 0"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackRate 48000
    }
}

SectionDevice."Mic" {
    Comment "Primary digital microphone"
    EnableSequence [
        cset "name='Handset Mic Switch' 1"
        cset "name='DMIC MUX5' DMIC0"
        cset "name='ADC MUX5' DMIC"
        cset "name='CDC_IF TX5 MUX' DEC5"
        cset "name='AIF1_CAP Mixer SLIM TX5' 1"
        cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
    ]
    DisableSequence [
        cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
        cset "name='AIF1_CAP Mixer SLIM TX5' 0"
        cset "name='CDC_IF TX5 MUX' ZERO"
        cset "name='DMIC MUX5' ZERO"
        cset "name='Handset Mic Switch' 0"
    ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},1"
        CaptureChannels 1
        CaptureRate 48000
    }
}
