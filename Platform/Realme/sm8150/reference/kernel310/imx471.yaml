%YAML 1.1
---
# Experimental common OEM IFE reference; not per-unit IQ calibration.
version: 1
sensor_model: imx471
residual_black_subtraction: 3840
range_normalization: 1.06201171875
sensor_controls:
  width: 2304
  height: 1728
  pixel_rate: 326400000
  line_length: 2560
  frame_length: 2124
  exposure_delay: 2
  gain_delay: 2
awb:
  algorithm: grey
  statistics_black: [64, 64, 64, 64]
  minimum_regions: 16
  minimum_signal: 32
agc:
  relativeLuminanceTarget: 0.16
  AeConstraintMode:
    ConstraintNormal:
      lower:
        qLo: 0.98
        qHi: 1.0
        yTarget: 0.16
      upper:
        qLo: 0.98
        qHi: 1.0
        yTarget: 0.85
  AeExposureMode:
    ExposureNormal:
      exposureTime: [100, 30000, 33200]
      gain: [1.0, 1.0, 16.0]
...
