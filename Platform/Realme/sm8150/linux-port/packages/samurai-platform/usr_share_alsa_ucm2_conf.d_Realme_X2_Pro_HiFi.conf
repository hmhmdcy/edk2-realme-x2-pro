SectionVerb {
    # FE open precedes device enable. Choose the initial BE from real jack
    # controls; subsequent device enables update the DPCM routing mixers.
    EnableSequence [
        exec "/usr/libexec/samurai-audio-route init ${CardId}"
    ]
    DisableSequence [
        exec "/usr/libexec/samurai-audio-route off ${CardId}"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "Stereo speakers"
    EnableSequence [
        exec "/usr/libexec/samurai-audio-route speaker ${CardId}"
    ]
    # Leave the selected BE available for the next FE open in this verb.
    # Stream close still powers down the amplifiers; verb disable clears it.
    DisableSequence [ ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackRate 48000
    }
}

SectionDevice."Headphones" {
    Comment "3.5 mm headphones"
    EnableSequence [
        exec "/usr/libexec/samurai-audio-route headphones ${CardId}"
    ]
    DisableSequence [ ]
    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackRate 48000
        JackCTL "hw:${CardId}"
        JackControl "Headphone Jack"
        JackHWMute "Speaker"
    }
}

SectionDevice."Mic" {
    Comment "Primary digital microphone"
    EnableSequence [
        exec "/usr/libexec/samurai-audio-route mic ${CardId}"
    ]
    DisableSequence [ ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},1"
        CaptureChannels 1
        CaptureRate 48000
    }
}

SectionDevice."Headset" {
    Comment "3.5 mm headset microphone"
    EnableSequence [
        exec "/usr/libexec/samurai-audio-route headset ${CardId}"
    ]
    DisableSequence [ ]
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},1"
        CaptureChannels 1
        CaptureRate 48000
        JackCTL "hw:${CardId}"
        JackControl "Mic Jack"
        JackHWMute "Mic"
    }
}
